# Copy to the plugin config directory as config.yaml:
#   herdr plugin config-dir herdr-workspace
# Missing config.yaml is seeded from this example on first run.
# How to write profiles: docs/profiles.md
#
# Each profile is a card in the popup. Tabs are created in order.
# The first pane of a tab is the tab's root (no split_from).
# Later panes split from an earlier pane id in the same tab.
# direction: right | down. ratio is the new pane's share of the split (0–1).
# command is sent with Enter after the layout is built; omit to leave a shell.
# Use YAML `|` for a multiline command.
# To start a named Herdr agent (so `herdr agent prompt <name>` works), set
# agent + kind instead of command. Extra flags go in args and are passed after `--`.

profiles:
  - id: full
    name: Full
    description: |
      Codex with a compact shell below and Reviewr on the right.
    tabs:
      - name: main
        panes:
          - id: agent
            name: agent
            agent: coder
            kind: codex
          - id: shell
            name: shell
            split_from: agent
            direction: down
            ratio: 0.85
          - id: reviewr
            name: reviewr
            split_from: agent
            direction: right
            ratio: 0.50
            command: herdr-reviewr

  - id: solo
    name: Solo
    description: |
      One tab, one shell in the project directory.
    tabs:
      - name: main
        panes:
          - id: shell
            name: shell
